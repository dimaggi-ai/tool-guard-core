[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolguard"
version = "0.1.0"
description = "Python SDK for Tool Guard Core — universal AI agent governance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ai", "agents", "governance", "policy", "tool-guard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core deps: httpx is required by proxy mode; everything else is stdlib.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Framework extras — only install what you use.
langchain   = ["langchain-core>=0.3"]
autogen     = ["pyautogen>=0.2"]
openai      = ["openai>=1.0"]
anthropic   = ["anthropic>=0.30"]

# Development / test extras. Includes langchain-core so test_langchain.py's
# real-dispatcher integration test actually runs through LangChain's own
# handle_event() instead of only exercising on_tool_start() directly — the
# gap that let a real bug (deny/escalate exceptions silently swallowed
# because raise_error defaulted to False) ship with 133 passing tests and
# 95% coverage. Coverage on mocked-only tests proves nothing about whether
# the mock matches the real dispatcher's behavior.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "langchain-core>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toolguard*"]

[tool.pytest.ini_options]
addopts = "--cov=toolguard --cov-report=term-missing -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["toolguard"]
branch = true

[tool.coverage.report]
show_missing = true
