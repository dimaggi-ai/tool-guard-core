[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm==10.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolguard-core"
dynamic = ["version"]
description = "Python SDK for Tool Guard Core — universal AI agent governance"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DIMAGGI AI" }]
keywords = ["ai", "agents", "governance", "policy", "tool-guard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core deps: httpx is required by proxy mode; everything else is stdlib.
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://dimaggi.ai/tool-guard"
Documentation = "https://github.com/dimaggi-ai/tool-guard-core/tree/main/sdk/python"
Source = "https://github.com/dimaggi-ai/tool-guard-core"
Issues = "https://github.com/dimaggi-ai/tool-guard-core/issues"

[project.optional-dependencies]
# Framework extras — only install what you use.
langchain   = ["langchain-core>=0.3"]
autogen     = ["pyautogen>=0.2"]
openai      = ["openai>=1.0"]
anthropic   = ["anthropic>=0.30"]

# Development / test extras. Includes langchain-core so test_langchain.py's
# real-dispatcher integration test actually runs through LangChain's own
# handle_event() instead of only exercising on_tool_start() directly — the
# gap that let a real bug (deny/escalate exceptions silently swallowed
# because raise_error defaulted to False) ship with 133 passing tests and
# 95% coverage. Coverage on mocked-only tests proves nothing about whether
# the mock matches the real dispatcher's behavior.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "langchain-core>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toolguard*"]

[tool.setuptools_scm]
# Python and Go releases use the same vX.Y.Z tag. Building the tagged tree
# therefore produces exactly X.Y.Z without a second version constant that can
# drift. The fallback exists only for source archives without Git metadata.
root = "../.."
fallback_version = "0.0.0"

[tool.pytest.ini_options]
addopts = "--cov=toolguard --cov-report=term-missing -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["toolguard"]
branch = true

[tool.coverage.report]
show_missing = true
