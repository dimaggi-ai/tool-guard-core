name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write     # GitHub Releases
  packages: write     # ghcr.io image push
  id-token: write     # actions/attest-build-provenance (OIDC signing)
  attestations: write # actions/attest-build-provenance (publish the attestation)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Guards against exactly the failure mode from the v0.3.0 release: the
      # tag was cut and published from a long-lived release/vX.Y.Z branch,
      # but nobody fast-forwarded main to it — so the GitHub Release existed
      # and worked, while the repo's default branch, its README, and its
      # CHANGELOG.md/Release-Notes.md (which every Release's own body links
      # to via blob/main/...) all still showed the PREVIOUS version. Refuse
      # to publish a release whose tag commit main doesn't already contain —
      # this must be the very first check, before any build/publish work.
      - name: Verify this tag is reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/main." >&2
            echo "::error::main must be fast-forwarded (or merged) to this commit BEFORE tagging — see RELEASING.md." >&2
            echo "::error::Fix: git checkout main && git merge --ff-only ${GITHUB_SHA} && git push origin main — then re-run this tag's release, or delete and re-push the tag once main is caught up." >&2
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} is reachable from main."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep in lockstep with go.mod and ci.yml — a release built on a
          # different toolchain than CI tested is untested code.
          go-version: "1.25.13"
          cache: true

      - name: Set up QEMU (for cross-arch container builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft (for SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Verify build + tests pass at this tag
        run: |
          go vet ./...
          go test -count=1 ./pkg/... ./cmd/... ./api/...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signs the release artifacts (archives + checksums.txt) with a
      # GitHub-hosted Sigstore identity, tying them verifiably to this
      # exact workflow run, commit, and source repo — an attacker who
      # compromises the GitHub Release upload step (or a mirror) can't
      # silently swap a binary without the attestation failing to verify.
      # This is NOT "reproducible builds" — it proves *provenance*
      # (these bytes came from this repo's CI, unmodified since), not
      # *reproducibility* (that rebuilding from source deterministically
      # reproduces the same bytes bit-for-bit). The latter needs a
      # separate rebuild-and-diff verifier job this repo doesn't have yet
      # — don't conflate the two when talking about this publicly.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"

      # Closes the gap between what the archives get (Sigstore provenance,
      # above) and what the container images got (nothing): sign the
      # multi-arch manifests keyless with the same GitHub OIDC identity.
      # Signing by digest, not tag — a tag is mutable, the digest is what
      # a verifier actually pins. Verify with:
      #
      #   cosign verify ghcr.io/dimaggi-ai/tool-guard-core:<version> \
      #     --certificate-identity-regexp '^https://github\.com/dimaggi-ai/tool-guard-core/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #
      # The regexp is end-anchored to full semver so an identity minted
      # for some other tag shape (v0.7.0-anything) can never satisfy the
      # documented verification.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container images (keyless, by digest)
        env:
          IMAGE: ghcr.io/dimaggi-ai/tool-guard-core
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          for ref in "${IMAGE}:${ver}" "${IMAGE}:latest"; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')
            echo "signing ${ref} => ${digest}"
            cosign sign --yes "${IMAGE}@${digest}"
          done

      # The GitHub Release (published by GoReleaser, above) already
      # claims the images are signed — so prove it before the workflow
      # goes green: verify both manifests against the exact documented
      # identity. A failed or skipped signing step fails the release
      # here instead of shipping release notes that overclaim.
      - name: Verify container signatures (fail release if unsigned)
        env:
          IMAGE: ghcr.io/dimaggi-ai/tool-guard-core
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          for ref in "${IMAGE}:${ver}" "${IMAGE}:latest"; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')
            cosign verify "${IMAGE}@${digest}" \
              --certificate-identity-regexp '^https://github\.com/dimaggi-ai/tool-guard-core/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
