name: Nightly stress

# Runs the load/overload/audit-chain suite (cmd/stress-test) with a longer
# fuzz budget than the 30s/target PR gate in ci.yml, asserts a qualified
# throughput/latency regression floor, and enforces the pathological-SQL
# duration ceiling.
#
# NOT run on every PR: GitHub-hosted runners have noisy, shared-tenant
# performance. The five post-fix runs cited below span 1,949.6-2,593.8 req/s
# on unchanged code. Gating every PR on that noise would produce failures
# unrelated to the reviewed change. Nightly on a fixed schedule instead —
# regressions still surface within a day without blocking unrelated PRs.
#
# The throughput floor is based on successful 2xx responses, including the 202
# returned for a valid escalation. Five healthy post-harness-fix runs on this
# runner class measured 1,949.6-2,593.8 req/s at concurrency 50. The 1,900
# floor leaves runner headroom while still failing a 10% regression from the
# prior 2,000 baseline. docs/performance.md records the run dates and method.

on:
  schedule:
    # 03:17 UTC — an off-the-hour minute so this doesn't land in the same
    # scheduling burst as every workflow that (mistakenly) uses "0 3 * * *".
    - cron: "17 3 * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  stress:
    name: stress + fuzz (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/tg ./cmd/tg
          go build -o bin/tg-proxy ./cmd/tg-proxy
          go build -o bin/stress-test ./cmd/stress-test

      - name: Record performance runner
        run: |
          uname -a
          lscpu
          go version

      - name: Pathological SQL classifier ceiling
        run: >-
          go test -tags=performance
          -run '^TestPerformance_SQLClassifyPathologicalInput$'
          -count=1 -timeout=3m ./pkg/engine/

      - name: Start tg-proxy
        run: |
          mkdir -p /tmp/nightly-stress
          ./bin/tg-proxy \
            -listen :9090 \
            -policy-dir ./policies \
            -audit-log /tmp/nightly-stress/decisions.jsonl \
            > /tmp/nightly-stress/proxy.log 2>&1 &
          echo $! > /tmp/nightly-stress/proxy.pid
          sleep 1

      - name: Load + overload + regression floor + audit-chain integrity
        run: |
          ./bin/stress-test \
            -target http://127.0.0.1:9090 \
            -concurrency 1,10,50,200 \
            -duration 15s \
            -overload 2000 \
            -tg-bin ./bin/tg \
            -audit-log /tmp/nightly-stress/decisions.jsonl \
            -floor-concurrency 50 \
            -floor-min-rps 1900 \
            -floor-max-p99 200ms

      - name: Stop tg-proxy
        if: always()
        run: kill "$(cat /tmp/nightly-stress/proxy.pid)" 2>/dev/null || true

      - name: Upload proxy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stress-proxy-log
          path: /tmp/nightly-stress/proxy.log
          retention-days: 14

      - name: Fuzz (2m per target)
        if: always()
        run: |
          go test -run '^$' -fuzz=FuzzActionEnvelopeDecode -fuzztime=2m ./cmd/tg-proxy/
          go test -run '^$' -fuzz=FuzzValidateJSONDepth -fuzztime=2m ./cmd/tg-proxy/
          go test -run '^$' -fuzz=FuzzPolicyYAML -fuzztime=2m ./cmd/tg-proxy/
