name: Nightly stress

# Runs the load/overload/audit-chain suite (cmd/stress-test) with a longer
# fuzz budget than the 30s/target PR gate in ci.yml, compares candidate
# throughput with the latest release on the same runner, and enforces the
# pathological-SQL duration ceiling.
#
# NOT run on every PR: GitHub-hosted runners have noisy, shared-tenant
# performance. Candidate and latest-release proxies run concurrently so
# host-wide throttling affects both measurements. A candidate at least 10%
# slower than the release baseline fails. This is a regression signal, not a
# capacity claim; docs/performance.md records the method and limitations.

on:
  schedule:
    # 03:17 UTC — an off-the-hour minute so this doesn't land in the same
    # scheduling burst as every workflow that (mistakenly) uses "0 3 * * *".
    - cron: "17 3 * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  stress:
    name: stress + fuzz (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/tg ./cmd/tg
          go build -o bin/tg-proxy ./cmd/tg-proxy
          go build -o bin/stress-test ./cmd/stress-test

      - name: Build latest release baseline
        run: |
          baseline_ref="$(bash scripts/select-stress-baseline.sh "${GITHUB_SHA}")"
          baseline_dir="${RUNNER_TEMP}/tool-guard-baseline"
          git worktree add --detach "${baseline_dir}" "${baseline_ref}"
          (
            cd "${baseline_dir}"
            go build -o "${RUNNER_TEMP}/baseline-tg-proxy" ./cmd/tg-proxy
          )
          {
            echo "BASELINE_REF=${baseline_ref}"
            echo "BASELINE_DIR=${baseline_dir}"
          } >> "${GITHUB_ENV}"
          echo "baseline_ref=${baseline_ref}"

      - name: Record performance runner
        run: |
          uname -a
          lscpu
          go version

      - name: Pathological SQL classifier ceiling
        run: >-
          go test -tags=performance
          -run '^TestPerformance_SQLClassifyPathologicalInput$'
          -count=1 -timeout=3m ./pkg/engine/

      - name: Start candidate and baseline tg-proxy
        run: |
          mkdir -p /tmp/nightly-stress
          ./bin/tg-proxy \
            -listen :9090 \
            -policy-dir ./policies \
            -audit-log /tmp/nightly-stress/decisions.jsonl \
            > /tmp/nightly-stress/candidate-proxy.log 2>&1 &
          echo $! > /tmp/nightly-stress/candidate-proxy.pid
          "${RUNNER_TEMP}/baseline-tg-proxy" \
            -listen :9091 \
            -policy-dir "${BASELINE_DIR}/policies" \
            -audit-log /tmp/nightly-stress/baseline-decisions.jsonl \
            > /tmp/nightly-stress/baseline-proxy.log 2>&1 &
          echo $! > /tmp/nightly-stress/baseline-proxy.pid
          sleep 1

      - name: Load + relative regression + overload + audit-chain integrity
        run: |
          echo "candidate=${GITHUB_SHA} baseline=${BASELINE_REF}"
          ./bin/stress-test \
            -target http://127.0.0.1:9090 \
            -concurrency 1,10,50,200 \
            -overload 2000 \
            -tg-bin ./bin/tg \
            -audit-log /tmp/nightly-stress/decisions.jsonl \
            -baseline-target http://127.0.0.1:9091 \
            -compare-concurrency 50 \
            -compare-duration 15s \
            -max-regression-pct 10

      - name: Stop candidate and baseline tg-proxy
        if: always()
        run: |
          for pid_file in /tmp/nightly-stress/candidate-proxy.pid /tmp/nightly-stress/baseline-proxy.pid; do
            if test -f "${pid_file}"; then
              kill "$(cat "${pid_file}")" 2>/dev/null || true
            fi
          done

      - name: Upload proxy logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stress-proxy-logs
          path: /tmp/nightly-stress/*.log
          retention-days: 14

      - name: Fuzz (2m per target)
        if: always()
        run: |
          go test -run '^$' -fuzz=FuzzActionEnvelopeDecode -fuzztime=2m ./cmd/tg-proxy/
          go test -run '^$' -fuzz=FuzzValidateJSONDepth -fuzztime=2m ./cmd/tg-proxy/
          go test -run '^$' -fuzz=FuzzPolicyYAML -fuzztime=2m ./cmd/tg-proxy/
