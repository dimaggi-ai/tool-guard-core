name: Weekly govulncheck

# ci.yml runs govulncheck on every push and pull request. New Go
# advisories are published between commits, so this job scans main once a
# week as well. A finding here means main has a newly reported reachable
# vulnerability; fix it before the next release (release.yml calls ci.yml,
# so the same check would block the tag).

on:
  schedule:
    # Mondays 04:41 UTC, an off-the-hour minute to avoid the scheduling burst.
    - cron: "41 4 * * 1"
  workflow_dispatch: {} # manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (weekly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Run govulncheck
        run: govulncheck ./...
