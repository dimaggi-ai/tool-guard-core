schema_version: 1
policy_id: coding-agent-secret-egress
name: coding-agent-secret-egress
description: >
  Deny a call that carries a value in a known API-key or token format unless
  its destination matches the host list in this file, and deny a curl, wget,
  nc, ncat, scp, sftp or rsync command line that names a dotenv file in one of
  the forms in limit 5.

  This policy is active whenever its file is loaded. A -policy-dir that
  contains this file loads it. It is a narrow pattern check. It is not
  protection against secret exfiltration in general. Read the five limits
  before relying on it.

  1. Known formats only. It matches the vendor formats listed in the rule:
  OpenAI sk-, GitHub ghp_/gho_/ghu_/ghs_/ghr_ and github_pat_, AWS AKIA/ASIA,
  Slack xox-, Google AIza, and PEM private-key headers. A secret in any other
  shape, a custom bearer string, a base64-encoded token, a rotated or re-keyed
  value, or raw file contents that do not match a format passes through. It is
  not a secret scanner and it does not detect exfiltration of unknown data.

  2. Fields read. The key check reads seven parameters: url, body, headers,
  data, json, params and command. A key in any other parameter is not seen.
  For command, the rule also requires a network indicator in the same command:
  the text "://", or one of these client names as a separate word: curl,
  wget, nc, ncat, netcat, socat, telnet, ftp, sftp, scp, rsync, ssh, http,
  https. A command that only handles a key locally, such as an export, a grep
  or a commit message, is allowed. A key sent by a client outside that list,
  in a command with no "://", is not seen.

  3. Listed hosts are matched as text. A key-shaped value is allowed when the
  URL host matches one of the two carve-out regexes: api.openai.com,
  api.anthropic.com, api.github.com, uploads.github.com, api.slack.com,
  hooks.slack.com, oauth2.googleapis.com, sts.googleapis.com,
  generativelanguage.googleapis.com, and the S3 endpoints s3.amazonaws.com,
  s3.<region>.amazonaws.com and their virtual-host forms. The match must end
  at the host: an optional port, then "/", "?", "#" or the end of the URL.
  Without the list the rule would block an agent from calling the APIs its
  credentials are for. The list is short: a private GitHub Enterprise host, a
  self-hosted model endpoint or an S3-compatible domain is not listed, and a
  legitimate call to it is denied. Add your own endpoints to both regexes.
  A listed host is not a trusted receiver: any S3 bucket and any Slack webhook
  matches, whoever owns it.

  4. The host check reads text, not connections. It does not follow redirects
  and does not resolve names. In a shell command, one listed URL anywhere in
  the command satisfies the carve-out for the whole command, even inside a
  comment.

  5. Dotenv rule. It reads the command parameter only and knows seven client
  names in two groups. For curl, wget, nc and ncat it denies these forms on
  one command line, with backslash-newline continuations joined: an @file or
  <file argument whose name ends in .env or contains .env followed by a dot;
  a "$(...)" or backtick substitution that mentions such a file; --post-file,
  --body-file, --upload-file or -T with such a file; and a pipe that has such
  a file name before it and a client name after it. For scp, sftp and rsync
  it denies a command line in which a word after the client name ends in
  .env, with or without a closing quote. It denies these forms toward listed
  hosts too. It does not cover another client (HTTPie, the AWS CLI, a Python
  or Node script), a copy of the file made first, a file named .envrc, a file
  name built from variables, a substitution nested inside another one, or,
  for scp, sftp and rsync, a name with a suffix such as .env.production. It
  can also deny a harmless line: one that mentions a dotenv file, then has a
  pipe, then a client name, or an scp, sftp or rsync line that downloads a
  dotenv file or names one later on the same line.

  A private key written into a workspace file is not this policy's job:
  coding_agent_writes.yaml rule-write-surface already denies it.
version: 1
status: approved
mode: enforcement

scope:
  tool_names: [http, fetch, webfetch]
  tool_groups: [network_egress, shell]

rules:
  - rule_id: rule-secret-in-egress
    name: no known credential format toward an unlisted destination
    rule_type: regex
    conditions:
      or:
        - and:
            - or:
                - field: parameters.url
                  operator: regex
                  value: &secretFormats '\b(sk-((proj|ant|svcacct|admin)-[A-Za-z0-9_-]{20,}|[A-Za-z0-9]{40,})|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|(AKIA|ASIA)[0-9A-Z]{16}|xox[abposr]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35})|-----BEGIN [A-Z ]*PRIVATE KEY-----'
                - field: parameters.body
                  operator: regex
                  value: *secretFormats
                - field: parameters.headers
                  operator: regex
                  value: *secretFormats
                - field: parameters.data
                  operator: regex
                  value: *secretFormats
                - field: parameters.json
                  operator: regex
                  value: *secretFormats
                - field: parameters.params
                  operator: regex
                  value: *secretFormats
            - not:
                field: parameters.url
                operator: regex
                value: '(?i)^https?://(api\.openai\.com|api\.anthropic\.com|api\.github\.com|uploads\.github\.com|api\.slack\.com|hooks\.slack\.com|oauth2\.googleapis\.com|sts\.googleapis\.com|generativelanguage\.googleapis\.com|s3\.amazonaws\.com|s3\.[a-z]{2}-[a-z]+-[0-9]+\.amazonaws\.com|[a-z0-9._-]+\.s3\.amazonaws\.com|[a-z0-9._-]+\.s3\.[a-z]{2}-[a-z]+-[0-9]+\.amazonaws\.com)(:[0-9]{1,5})?([/?#]|$)'
        - and:
            - field: parameters.command
              operator: regex
              value: *secretFormats
            - field: parameters.command
              operator: regex
              value: '(?i)(://|(^|[\s;&|(\x60])(\S+/)?(curl|wget|nc|ncat|netcat|socat|telnet|ftp|sftp|scp|rsync|ssh|http|https)(\s|$))'
            - not:
                field: parameters.command
                operator: regex
                value: '(?i)\bhttps?://(api\.openai\.com|api\.anthropic\.com|api\.github\.com|uploads\.github\.com|api\.slack\.com|hooks\.slack\.com|oauth2\.googleapis\.com|sts\.googleapis\.com|generativelanguage\.googleapis\.com|s3\.amazonaws\.com|s3\.[a-z]{2}-[a-z]+-[0-9]+\.amazonaws\.com|[a-z0-9._-]+\.s3\.amazonaws\.com|[a-z0-9._-]+\.s3\.[a-z]{2}-[a-z]+-[0-9]+\.amazonaws\.com)(:[0-9]{1,5})?([/?#]|[''\"\x60)]*([\s;|&<>]|$))'
    effect: deny
    effect_config:
      severity: high
      suggested_response: "Egress blocked: the call carries a value in a known API-key or token format and its destination does not match the host list in the coding-agent-secret-egress policy. If this call is legitimate, add its host to both carve-out regexes in that policy file."
    citation:
      document_id: SEC-SECRETS
      section: "1"
      excerpt: "Credentials may not leave the workstation inside an agent tool call."

  - rule_id: rule-dotenv-upload
    name: no dotenv file named by a curl, wget, nc, ncat, scp, sftp or rsync command line
    rule_type: regex
    conditions:
      field: parameters.command
      operator: regex
      value: '(?i)(\b(curl|wget|nc|ncat)\b([^\n]|\\\n)*([@<]\s*\S*\.env\b|(\$\(|\x60)[^)\x60]*\.env\b|(--post-file|--body-file|--upload-file|\s-T)[=\s]\s*\S*\.env\b)|\.env\b([^\n]|\\\n)*\|([^\n]|\\\n)*\b(curl|wget|nc|ncat)\b|\b(scp|sftp|rsync)\b([^\n]|\\\n)*\s\S*\.env[''"]?(\s|$))'
    effect: deny
    effect_config:
      severity: high
      suggested_response: "Egress blocked: a curl, wget, nc, ncat, scp, sftp or rsync command line names a dotenv file."
    citation:
      document_id: SEC-SECRETS
      section: "2"
      excerpt: "Dotenv files hold credentials and may not be sent by an agent's shell network client."
