schema_version: 1
policy_id: coding-agent-secret-commands
name: coding-agent-secret-commands
description: >
  Record a secret that a coding agent types into a shell command, writes into
  an agent config file, or copies into a note. This policy ships in shadow
  mode: it records what it would do and blocks nothing. Change mode to
  enforcement only after you have read its records for your own traffic.

  1. What it reads. Shell rules read the command parameter. Write rules read
  content (write), new_string (edit) and edits (multiedit, read as one text).
  Because edits is one text, it includes each old_string, so a multiedit
  that removes a secret is recorded too. A secret in any other parameter is
  not seen.

  2. Shapes. Inline passwords: PGPASSWORD, MYSQL_PWD, MYSQL_ROOT_PASSWORD,
  MYSQL_PASSWORD and REDISCLI_AUTH assignments; sshpass -p; mysql -p with the
  value attached; --password=value or --password value (so the word after a
  bare --password, such as a database name, is also recorded); curl -u
  user:password;
  a libpq password= keyword; redis-cli -a. Credentials in a URL
  (scheme://user:password@host) and api_key, apikey, access_token, auth_token
  or token in a query string. Authorization: Bearer, Basic or Token headers,
  and x-api-key, api-key, apikey, private-token and x-auth-token headers.
  Provider keys, written by hand: sk-proj-, sk-svcacct-, sk-admin-,
  sk-ant-api, sk-ant-admin and sk-or-v1- keys, and sk- followed by 32 or more
  letters and digits with no - or _, so a name such as sk-learn-contrib is
  not recorded; ghp_/gho_/ghu_/ghs_/ghr_, github_pat_, glpat-, npm_, xox?-,
  sk_live_/rk_live_, sbp_, sgp_, PEM private-key headers, and a 40-character
  value after aws_secret_access_key. The minimum lengths are not from the
  providers' documentation, which does not state these lengths.

  The secret_classify layer uses the pinned gitleaks rules with a
  case-insensitive keyword prefilter, capture groups, entropy thresholds,
  allowlist regexes and stopwords. It scans at most 65,536 bytes per field
  and reports truncation. Path-dependent rules are excluded because this
  layer scans text without a file path. AWS IDs, JWTs and curl credentials
  keep their hand-written rules. The Sourcegraph rule is excluded because
  it also matches bare commit hashes. Generic API keys have a separate
  low-severity flag rule. The hand-written patterns do not use entropy or
  the gitleaks allowlists.

  3. Hand-written password exclusions. A value that starts with $, <, *, { or -, so
  "$DB_PASSWORD", "${VAR}", "<password>" and a following flag such as
  "--password --user=root" are not recorded. A quote before the value is
  skipped, also in its JSON-escaped form \", so a value inside a JSON string
  in settings.local.json is read. URL credentials toward localhost,
  127.0.0.0/8, 0.0.0.0, [::1], 10/8, 172.16/12, 192.168/16,
  host.docker.internal or a single-label host such as "db" are not recorded,
  because local development defaults look like this. The host check is a
  text check: a command that names one local credential URL also hides a
  remote credential URL on the same line. The rules match text, so they
  catch a secret pasted by mistake, not one an agent hides on purpose: a
  key split across shell variables (A=sk-pro; B=j-...; "$A$B"), encoded,
  or built by a script is not recorded.

  4. Effects as drafted. Inline password, URL credentials, auth header,
  provider key, secret in an agent config file: deny. A JWT, or a secret in
  a note or transcript: escalate, because public JWTs and harmless notes
  exist. An AWS access key ID alone (AKIA or ASIA): flag, because it is an
  identifier, not the secret. git add of .claude/settings.json or
  .claude/settings.local.json: flag. A git commit is not read, because its message
  often names the file without adding it. In shadow mode none of these
  effects blocks a call.

  5. Core has no redaction. The audit record names the matched rules and
  the decision. tg hook and tg-proxy do not store the raw tool parameters,
  but the record can hold values taken from them: an amount field, a
  decision reason that quotes a value such as a protected file path, and,
  for tg hook, an envelope's parameters_redacted field as given. tg hook
  itself never fills that field.
version: 1
status: approved
mode: shadow

scope:
  # Scoped by group, like coding_agent_secret_egress: tg hook puts Bash and
  # unknown tools in "shell" and write, edit and multiedit in
  # "filesystem_writes".
  tool_groups: [shell, filesystem_writes]

# Value patterns are YAML anchors (&name) defined at first use and reused
# (*name) by every later rule, so one edit applies to commands, config files
# and notes at the same time.
rules:
  - rule_id: rule-inline-password
    name: password typed into a database, SSH, Redis or curl command
    rule_type: content
    conditions:
      or:
        - {field: parameters.command, operator: regex, value: &envAssign '(?i)\b(?:PGPASSWORD|MYSQL_PWD|MYSQL_ROOT_PASSWORD|MYSQL_PASSWORD|REDISCLI_AUTH)\\?[''"]?\s*[=:]\s*(?:\\?[''"])?[^\s$''"\\<*{-][^\s$''"\\]{2,}'}
        - {field: parameters.command, operator: regex, value: &sshpass '\bsshpass\s+-p\s*(?:\\?[''"])?[^\s$''"\\<*{-][^\s$''"\\]*'}
        - {field: parameters.command, operator: regex, value: &mysqlP '(?i)\bmysql(?:dump|admin|sh)?\b[^|;&\n]*\s-p(?:\\?[''"])?[^\s$''"\\<*{-][^\s$''"\\]{2,}'}
        - {field: parameters.command, operator: regex, value: &passwordFlag '(?i)--password(?:=|\s+)(?:\\?[''"])?[^\s$''"\\<*{-][^\s$''"\\]{2,}'}
        - {field: parameters.command, operator: regex, value: &curlUser '\bcurl\b[^|;&\n]*\s(?:-u|--user)(?:=|\s*)(?:\\?[''"])?[^\s:$''"\\-][^\s:$''"\\]*:[^\s$''"\\]{3,}'}
        - {field: parameters.command, operator: regex, value: &libpqPassword '(?i)(?:^|[\s''"])password\s*=\s*(?:\\?[''"])?[^\s$''"\\<*{-][^\s$''"\\]{2,}'}
        - {field: parameters.command, operator: regex, value: &redisA '\bredis-cli\b[^|;&\n]*\s-a\s*(?:\\?[''"])?[^\s$''"\\<*{-][^\s$''"\\]{2,}'}
    effect: deny
    effect_config:
      severity: high
      suggested_response: "A password is typed into the command. Read it from an environment variable such as $DB_PASSWORD, or from a file, instead."
    citation:
      document_id: SEC-SECRETS
      section: "3"
      excerpt: "Secrets may not be typed into an agent's shell command."

  - rule_id: rule-url-credentials
    name: credentials in a URL toward a non-local host, or a key in a query string
    rule_type: content
    conditions:
      or:
        - and:
            - {field: parameters.command, operator: regex, value: &urlCred '(?i)\b[a-z][a-z0-9+.-]*://[^\s:/@''"\\]+:[^\s@/?#$''"\\]{3,}@[^\s/?#''"\\]+'}
            - not: {field: parameters.command, operator: regex, value: &urlCredLocal '(?i)\b[a-z][a-z0-9+.-]*://[^\s:/@''"\\]+:[^\s@/?#$''"\\]{3,}@(?:localhost|127\.[0-9.]+|0\.0\.0\.0|\[::1\]|10\.[0-9.]+|192\.168\.[0-9.]+|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9.]+|host\.docker\.internal|[a-z0-9-]+)(?:[:/?#\s''"\\]|$)'}
        - {field: parameters.command, operator: regex, value: &queryKey '(?i)[?&](?:api[_-]?key|apikey|access_token|auth_token|token)=[^\s&#$''"\\<*{-][^\s&#$''"\\]{11,}'}
    effect: deny
    effect_config:
      severity: high
      suggested_response: "The command carries credentials in a URL. Pass them through an environment variable or a credentials file."
    citation:
      document_id: SEC-SECRETS
      section: "3"
      excerpt: "Secrets may not be typed into an agent's shell command."

  - rule_id: rule-auth-header
    name: authorization or API-key header with a literal value
    rule_type: content
    conditions:
      field: parameters.command
      operator: regex
      value: &authHeader '(?i)\b(?:authorization:\s*(?:bearer|basic|token)\s+|(?:x-api-key|api-key|apikey|private-token|x-auth-token):\s*)(?:\\?[''"])?[^\s$''"\\<*{-][^\s$''"\\]{15,}'
    effect: deny
    effect_config:
      severity: high
      suggested_response: "The command sends a literal token in a header. Use a variable such as $TOKEN instead."
    citation:
      document_id: SEC-SECRETS
      section: "3"
      excerpt: "Secrets may not be typed into an agent's shell command."

  - rule_id: rule-provider-key-in-command
    name: key in a known provider format inside a command
    rule_type: content
    conditions:
      or:
        - {field: parameters.command, operator: regex, value: &providerKey '\b(?:sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}|sk-ant-(?:api|admin)\d\d-[A-Za-z0-9_-]{20,}|sk-or-v1-[0-9a-f]{64}|sk-[A-Za-z0-9]{32,}\b|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,}|glpat-[A-Za-z0-9_-]{20,}|npm_[A-Za-z0-9]{36}|xox[abprs]-[A-Za-z0-9-]{10,}|[sr]k_live_[A-Za-z0-9]{16,}|sbp_[0-9a-f]{40}|sgp_(?:[a-f0-9]{16}_|local_)?[a-f0-9]{40}\b)|-----BEGIN [A-Z ]*PRIVATE KEY-----|(?i:aws_secret_access_key)\\?[''"]?\s*[=:\s]\s*(?:\\?[''"])?[A-Za-z0-9/+]{40}'}
        # Rule data is generated from third_party/gitleaks/gitleaks.toml.
        - &gitleaksCommand {"and": [{"field": "parameters.command", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.command", "classes": ["provider"], "exclude_rules": ["aws-access-token", "yandex-aws-access-token", "jwt", "jwt-base64", "curl-auth-user", "curl-auth-header", "sourcegraph-access-token"]}}]}
    effect: deny
    effect_config:
      severity: high
      suggested_response: "The command holds a provider key. Read it from an environment variable or a secret store instead."
    citation:
      document_id: SEC-SECRETS
      section: "3"
      excerpt: "Secrets may not be typed into an agent's shell command."

  - rule_id: rule-aws-key-id-in-command
    name: AWS access key ID inside a command
    rule_type: content
    conditions:
      field: parameters.command
      operator: regex
      value: &awsKeyId '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    effect: flag
    effect_config:
      severity: low
    citation:
      document_id: SEC-SECRETS
      section: "3"
      excerpt: "An access key ID identifies a key; the secret access key is the secret."

  - rule_id: rule-jwt-in-command
    name: JWT inside a command
    rule_type: content
    conditions:
      field: parameters.command
      operator: regex
      value: &jwt '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
    effect: escalate
    effect_config:
      severity: medium
      suggested_response: "The command holds a JWT. A public anon key is harmless; a service-role key is a secret. Check which one it is."
    citation:
      document_id: SEC-SECRETS
      section: "3"
      excerpt: "Secrets may not be typed into an agent's shell command."

  - rule_id: rule-secret-in-agent-config
    name: secret written into an agent config file
    rule_type: content
    conditions:
      and:
        - {field: parameters.file_path, operator: regex, value: &agentConfigPath '(^|/)\.(claude|cursor|gemini)/'}
        - or:
            - {field: parameters.content, operator: regex, value: *envAssign}
            - {field: parameters.content, operator: regex, value: *sshpass}
            - {field: parameters.content, operator: regex, value: *mysqlP}
            - {field: parameters.content, operator: regex, value: *passwordFlag}
            - {field: parameters.content, operator: regex, value: *curlUser}
            - {field: parameters.content, operator: regex, value: *libpqPassword}
            - {field: parameters.content, operator: regex, value: *redisA}
            - {field: parameters.content, operator: regex, value: *queryKey}
            - {field: parameters.content, operator: regex, value: *providerKey}
            - &gitleaksContent {"and": [{"field": "parameters.content", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.content", "classes": ["provider"], "exclude_rules": ["aws-access-token", "yandex-aws-access-token", "jwt", "jwt-base64", "curl-auth-user", "curl-auth-header", "sourcegraph-access-token"]}}]}
            - {field: parameters.content, operator: regex, value: *authHeader}
            - and:
                - {field: parameters.content, operator: regex, value: *urlCred}
                - not: {field: parameters.content, operator: regex, value: *urlCredLocal}
            - {field: parameters.new_string, operator: regex, value: *envAssign}
            - {field: parameters.new_string, operator: regex, value: *sshpass}
            - {field: parameters.new_string, operator: regex, value: *mysqlP}
            - {field: parameters.new_string, operator: regex, value: *passwordFlag}
            - {field: parameters.new_string, operator: regex, value: *curlUser}
            - {field: parameters.new_string, operator: regex, value: *libpqPassword}
            - {field: parameters.new_string, operator: regex, value: *redisA}
            - {field: parameters.new_string, operator: regex, value: *queryKey}
            - {field: parameters.new_string, operator: regex, value: *providerKey}
            - &gitleaksNewString {"and": [{"field": "parameters.new_string", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.new_string", "classes": ["provider"], "exclude_rules": ["aws-access-token", "yandex-aws-access-token", "jwt", "jwt-base64", "curl-auth-user", "curl-auth-header", "sourcegraph-access-token"]}}]}
            - {field: parameters.new_string, operator: regex, value: *authHeader}
            - and:
                - {field: parameters.new_string, operator: regex, value: *urlCred}
                - not: {field: parameters.new_string, operator: regex, value: *urlCredLocal}
            - {field: parameters.edits, operator: regex, value: *envAssign}
            - {field: parameters.edits, operator: regex, value: *sshpass}
            - {field: parameters.edits, operator: regex, value: *mysqlP}
            - {field: parameters.edits, operator: regex, value: *passwordFlag}
            - {field: parameters.edits, operator: regex, value: *curlUser}
            - {field: parameters.edits, operator: regex, value: *libpqPassword}
            - {field: parameters.edits, operator: regex, value: *redisA}
            - {field: parameters.edits, operator: regex, value: *queryKey}
            - {field: parameters.edits, operator: regex, value: *providerKey}
            - &gitleaksEdits {"and": [{"field": "parameters.edits", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.edits", "classes": ["provider"], "exclude_rules": ["aws-access-token", "yandex-aws-access-token", "jwt", "jwt-base64", "curl-auth-user", "curl-auth-header", "sourcegraph-access-token"]}}]}
            - {field: parameters.edits, operator: regex, value: *authHeader}
            - and:
                - {field: parameters.edits, operator: regex, value: *urlCred}
                - not: {field: parameters.edits, operator: regex, value: *urlCredLocal}
    effect: deny
    effect_config:
      severity: high
      suggested_response: "The write puts a secret into an agent config file. Agent settings are often committed or shared; reference an environment variable instead."
    citation:
      document_id: SEC-SECRETS
      section: "4"
      excerpt: "Secrets may not be persisted in agent configuration files."

  - rule_id: rule-secret-in-agent-note
    name: secret copied into an agent note or transcript
    rule_type: content
    conditions:
      and:
        - {field: parameters.file_path, operator: regex, value: &agentNotePath '(?i)(^|/)(?:MEMORY|HANDOFF|DEPLOY|NOTES?)[^/]*\.md$|(^|/)\.specstory/'}
        - or:
            - {field: parameters.content, operator: regex, value: *envAssign}
            - {field: parameters.content, operator: regex, value: *sshpass}
            - {field: parameters.content, operator: regex, value: *mysqlP}
            - {field: parameters.content, operator: regex, value: *passwordFlag}
            - {field: parameters.content, operator: regex, value: *curlUser}
            - {field: parameters.content, operator: regex, value: *libpqPassword}
            - {field: parameters.content, operator: regex, value: *redisA}
            - {field: parameters.content, operator: regex, value: *queryKey}
            - {field: parameters.content, operator: regex, value: *providerKey}
            - *gitleaksContent
            - {field: parameters.content, operator: regex, value: *authHeader}
            - and:
                - {field: parameters.content, operator: regex, value: *urlCred}
                - not: {field: parameters.content, operator: regex, value: *urlCredLocal}
            - {field: parameters.new_string, operator: regex, value: *envAssign}
            - {field: parameters.new_string, operator: regex, value: *sshpass}
            - {field: parameters.new_string, operator: regex, value: *mysqlP}
            - {field: parameters.new_string, operator: regex, value: *passwordFlag}
            - {field: parameters.new_string, operator: regex, value: *curlUser}
            - {field: parameters.new_string, operator: regex, value: *libpqPassword}
            - {field: parameters.new_string, operator: regex, value: *redisA}
            - {field: parameters.new_string, operator: regex, value: *queryKey}
            - {field: parameters.new_string, operator: regex, value: *providerKey}
            - *gitleaksNewString
            - {field: parameters.new_string, operator: regex, value: *authHeader}
            - and:
                - {field: parameters.new_string, operator: regex, value: *urlCred}
                - not: {field: parameters.new_string, operator: regex, value: *urlCredLocal}
            - {field: parameters.edits, operator: regex, value: *envAssign}
            - {field: parameters.edits, operator: regex, value: *sshpass}
            - {field: parameters.edits, operator: regex, value: *mysqlP}
            - {field: parameters.edits, operator: regex, value: *passwordFlag}
            - {field: parameters.edits, operator: regex, value: *curlUser}
            - {field: parameters.edits, operator: regex, value: *libpqPassword}
            - {field: parameters.edits, operator: regex, value: *redisA}
            - {field: parameters.edits, operator: regex, value: *queryKey}
            - {field: parameters.edits, operator: regex, value: *providerKey}
            - *gitleaksEdits
            - {field: parameters.edits, operator: regex, value: *authHeader}
            - and:
                - {field: parameters.edits, operator: regex, value: *urlCred}
                - not: {field: parameters.edits, operator: regex, value: *urlCredLocal}
    effect: escalate
    effect_config:
      severity: medium
      suggested_response: "The write copies a secret into a note or transcript. Replace it with a reference to where the secret is stored."
    citation:
      document_id: SEC-SECRETS
      section: "4"
      excerpt: "Secrets may not be persisted in agent notes or transcripts."

  - rule_id: rule-git-add-agent-settings
    name: agent settings file staged with git add
    rule_type: content
    conditions:
      field: parameters.command
      operator: regex
      value: '\bgit\s+add\b[^|;&\n]*\.claude/settings(?:\.local)?\.json'
    effect: flag
    effect_config:
      severity: medium
    citation:
      document_id: SEC-SECRETS
      section: "4"
      excerpt: "Agent settings files may hold secrets and should not reach version control."

  - rule_id: rule-generic-api-key
    name: possible generic API key in command or write content
    rule_type: content
    conditions:
      or:
        - {"and": [{"field": "parameters.command", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.command", "classes": ["generic"]}}]}
        - {"and": [{"field": "parameters.content", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.content", "classes": ["generic"]}}]}
        - {"and": [{"field": "parameters.new_string", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.new_string", "classes": ["generic"]}}]}
        - {"and": [{"field": "parameters.edits", "operator": "exists", "value": true}, {"secret_classify": {"field": "parameters.edits", "classes": ["generic"]}}]}
    effect: flag
    effect_config:
      severity: low
    citation:
      document_id: SEC-SECRETS
      section: "3"
      excerpt: "Generic key assignments need review because their format does not identify a provider."
