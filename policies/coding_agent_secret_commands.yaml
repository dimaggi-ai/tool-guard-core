": "parameters.command", "operator": "contains", "value": "glagent-"}, {"field": "parameters.command", "operator": "regex", "value": "glagent-[0-9a-zA-Z_\\-]{50}"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "gloas-"}, {"field": "parameters.command", "operator": "regex", "value": "gloas-[0-9a-zA-Z_\\-]{64}"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "glpat-"}, {"field": "parameters.command", "operator": "regex", "value": "glpat-[\\w-]{20}"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "glpat-"}, {"field": "parameters.command", "operator": "regex", "value": "\\bglpat-[0-9a-zA-Z_-]{27,300}\\.[0-9a-z]{2}[0-9a-z]{7}\\b"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "glptt-"}, {"field": "parameters.command", "operator": "regex", "value": "glptt-[0-9a-f]{40}"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "GR1348941"}, {"field": "parameters.command", "operator": "regex", "value": "GR1348941[\\w-]{20}"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "glrt-"}, {"field": "parameters.command", "operator": "regex", "value": "glrt-[0-9a-zA-Z_\\-]{20}"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "glrt-"}, {"field": "parameters.command", "operator": "regex", "value": "\\bglrt-t\\d_[0-9a-zA-Z_\\-]{27,300}\\.[0-9a-z]{2}[0-9a-z]{7}\\b"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "glsoat-"}, {"field": "parameters.command", "operator": "regex", "value": "glsoat-[0-9a-zA-Z_\\-]{20}"}]}, {"and": [{"field": "parameters.command", "operator": "contains", "value": "_gitlab_session="}, {"field": "parameters.command", "operator": "regex", "value": "_gitlab_session=[0-9a-z]{32}"}]}, {"and": [{"or": [{"field": "parameters.command", "operator": "contains", "value": "pat."}, {"field": "parameters.command", "operator": "contains", "value": "